<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="bg-white border-bottom shadow-sm">
        <div class="container py-4">
            <h1 class="fs-3 fw-bold mb-1">Gerenciamento de Usuários</h1>

            <p class="text-secondary mb-0">
                Cadastre, edite e visualize os usuários do sistema.
            </p>
        </div>
    </header>

    <div class="container py-5">
        <div class="row g-4 mb-5">
            <div class="col-12 col-lg-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body p-4 p-md-5">
                        <div class="mb-4">
                            <h2 class="fs-4 fw-bold mb-1">
                                Cadastrar usuário
                            </h2>
                            <p class="text-secondary mb-0">
                                Preencha os dados para adicionar um novo usuário.
                            </p>
                        </div>

                        <form id="form">
                            <div class="mb-3">
                                <label for="nome" class="form-label fw-medium">
                                    Nome
                                </label>
                                <input id="nome" type="text" class="form-control form-control-lg"
                                    placeholder="Digite o nome">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label fw-medium">
                                    Email
                                </label>
                                <input id="email" type="email" class="form-control form-control-lg"
                                    placeholder="usuario@email.com">
                            </div>
                            <div class="mb-4">
                                <label for="telefone" class="form-label fw-medium">
                                    Telefone
                                </label>
                                <input id="telefone" type="text" class="form-control form-control-lg"
                                    placeholder="(00) 00000-0000">
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                Cadastrar usuário
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body p-4 p-md-5">
                        <div class="mb-4">
                            <h2 class="fs-4 fw-bold mb-1">
                                Editar usuário
                            </h2>
                            <p class="text-secondary mb-0">
                                Informe o ID e altere os dados necessários.
                            </p>
                        </div>
                        <form id="form-update">
                            <div class="mb-3">
                                <label for="id-update" class="form-label fw-medium">ID</label>
                                <input id="id-update" type="text" class="form-control form-control-lg" placeholder="ID do usuário">
                            </div>

                            <div class="mb-3">
                                <label for="nome-update" class="form-label fw-medium">Nome</label>
                                <input id="nome-update" type="text" class="form-control form-control-lg" placeholder="Digite o nome">
                            </div>

                            <div class="mb-3">
                                <label for="email-update" class="form-label fw-medium">Email</label>
                                <input id="email-update" type="email" class="form-control form-control-lg" placeholder="usuario@email.com">
                            </div>

                            <div class="mb-4">
                                <label for="telefone-update" class="form-label fw-medium">Telefone</label>
                                <input id="telefone-update" type="text" class="form-control form-control-lg" placeholder="(00) 00000-0000">
                            </div>

                            <button type="submit" class="btn btn-dark btn-lg w-100">Salvar alterações</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="container p-5 shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fs-4 fw-bold mb-1">
                        Usuários cadastrados
                    </h2>

                    <p class="text-secondary mb-0">
                        Lista de usuários disponíveis no sistema.
                    </p>
                </div>

            </div>

            <div id="usuario-list" class="row g-4"></div>

        </div>

    </div>


    <script src="./apis/usuario/read.js"></script>
    <script src="./apis/usuario/register.js"></script>
    <script src="./apis/usuario/delete.js"></script>
    <script src="./apis/usuario/update.js"></script>

</body>
</html>
